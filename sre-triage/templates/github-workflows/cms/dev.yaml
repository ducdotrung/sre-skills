name: Build and Deploy to DEV env

on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev
    types:
      - closed # This only trigger this workflow when a PR is closed
    paths:
      - "k8s/**"

env:
  IMAGE_NAME: "{ECR_PREFIX}cms"
  IMAGE_TAG_SUBFIX: "dev"
  APP_NAME: cms
  APP_ENV: dev
  image_build_args: |
    VITE_APP_ENVIRONMENT=${{ vars.DEV_VITE_APP_ENVIRONMENT }}
    VITE_APP_HOST_API=${{ vars.DEV_VITE_APP_HOST_API }}
    VITE_APP_ENVIRONMENT=${{ vars.DEV_VITE_APP_ENVIRONMENT }}

permissions:
  contents: read
  pull-requests: read

jobs:
  prepare:
    runs-on: [self-hosted, linux, {your-org}]
    outputs:
      image_tag: ${{ steps.set_env.outputs.image_tag }}
      commit_message: ${{ steps.set_env.outputs.commit_message }}
      date_build: ${{ steps.set_env.outputs.date_build }}
    steps:
      - name: Checkout using my visa
        uses: actions/checkout@v4
      - name: Set env to outputs
        id: set_env
        run: |
          echo "DATE_BUILD=$(TZ='Asia/Ho_Chi_Minh' date +'%y%m%d.%H%M')" >> $GITHUB_OUTPUT
          echo "image_tag=$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT
          echo 'commit_message<<EOF' >> $GITHUB_OUTPUT
          echo $(git log -1 --pretty=format:'%B') >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT

  build-and-push:
    runs-on: [self-hosted, linux, {your-org}]
    needs:
      - prepare
    steps:
      - name: Build and push
        uses: {your-github-org}/action-docker-build@v1
        with:
          tags: ${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.image_tag }}-${{ env.IMAGE_TAG_SUBFIX }}-${{ needs.prepare.outputs.date_build }}
          context: .
          build-args: ${{ env.image_build_args }}

  deploy:
    runs-on: [self-hosted, linux, {your-org}]
    needs:
      - prepare
      - build-and-push
    steps:
      - name: Trigger deployment
        uses: {your-github-org}/argo-deployer@v2
        with:
          deployer_url: ${{ vars.ARGO_DEPLOYER_URL }}
          deployer_auth: ${{ secrets.ARGO_DEPLOYER_AUTH }}
          application: ${{ env.APP_NAME }}
          environment: ${{ env.APP_ENV }}
          image_tag: ${{ needs.prepare.outputs.image_tag }}-${{ env.IMAGE_TAG_SUBFIX }}-${{ needs.prepare.outputs.date_build }}
          message: "${{ github.actor }}: ${{ needs.prepare.outputs.commit_message }}"
