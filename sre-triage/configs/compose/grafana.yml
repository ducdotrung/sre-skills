services:
  grafana:
    image: grafana/grafana:10.4.1
    container_name: grafana
    restart: unless-stopped
    ports:
     - '3000:3000'
    volumes:
      - /data/grafana/grafana-storage:/var/lib/grafana:rw
      - /data/grafana/provisioning:/etc/grafana/provisioning:rw
      - /data/grafana/grafana.ini:/etc/grafana/grafana.ini:rw
      - ./ldap.toml:/etc/grafana/ldap.toml:ro
