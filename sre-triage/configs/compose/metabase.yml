services:
  metabase:
    #image: metabase/metabase:latest
    build: .
    container_name: metabase
    hostname: metabase
    volumes:
      - /dev/urandom:/dev/random:ro
    ports:
      - 4000:3000
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: metabase
      MB_DB_PASS: eicahgahgu5AhLog0aTijoakaed8Sho5
      MB_DB_HOST: {your-cluster-prefix}-postgre-uat.***.ap-northeast-1.rds.amazonaws.com
    healthcheck:
      test: curl --fail -I http://localhost:3000/api/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
    restart: always
